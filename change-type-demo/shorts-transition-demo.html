<!DOCTYPE html>
<html>
<head>
  <title>Shorts SDR/HDR Transition Demo</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0f0f0f;
      color: #fff;
      font-family: 'Roboto', Arial, sans-serif;
      overflow: hidden;
    }
    #stage {
      position: relative;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #short {
      position: relative;
      height: 92vh;
      aspect-ratio: 9 / 16;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
    }
    video {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* Covers the video while it is hidden (ytlr_player HidePlayer). */
    #player-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: #000;
    }
    #short.hide-player #player-bg { z-index: 2; }
    /* Vertical list of thumbnails; one item per frame height. */
    #list {
      position: absolute;
      inset: 0;
      z-index: 3;
      transform: translateY(0) translateZ(0);
      transition: transform 300ms cubic-bezier(0.26, 0.86, 0.44, 0.985);
    }
    .item {
      position: absolute;
      left: 0;
      width: 100%;
      background-size: cover;
      background-position: center;
    }
    .item.thumbnail-hidden { opacity: 0; }
    #overlay {
      position: absolute;
      z-index: 4;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 24px 20px 28px 20px;
      opacity: 1;
      transition: opacity 0.3s cubic-bezier(0.05, 0, 0, 1);
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.75));
    }
    #overlay.hidden {
      opacity: 0;
      transition: opacity 0.1s cubic-bezier(0.05, 0, 0, 1);
    }
    #channel { display: flex; align-items: center; gap: 10px; font-size: 1.1rem; font-weight: 500; }
    #avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: #3ea6ff; display: flex; align-items: center; justify-content: center;
      font-weight: 700;
    }
    #subscribe {
      margin-left: 6px; padding: 6px 14px; border-radius: 18px;
      background: #fff; color: #0f0f0f; font-size: 0.9rem; font-weight: 600;
    }
    #title { margin-top: 12px; font-size: 1.05rem; line-height: 1.4; }
    .badge {
      display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 4px;
      font-size: 0.8rem; font-weight: 700; vertical-align: middle;
    }
    .badge.sdr { background: #616161; color: #fff; }
    .badge.hdr { background: #ffd54f; color: #000; }
    #actions {
      position: absolute;
      left: calc(50% + 46vh * 9 / 16 + 24px);
      bottom: 6vh;
      display: flex;
      flex-direction: column;
      gap: 22px;
      align-items: center;
      font-size: 0.85rem;
      color: #f1f1f1;
    }
    .action { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .icon {
      width: 52px; height: 52px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
    }
    #nav {
      position: absolute;
      right: 48px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .nav-btn {
      width: 56px; height: 56px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; color: #aaa;
    }
    .nav-btn.active { background: #fff; color: #0f0f0f; }
    #stats {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 380px;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.45;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px 12px;
      white-space: pre;
    }
    #toast {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 16px;
      border-radius: 8px;
      background: rgba(255, 138, 101, 0.9);
      color: #000;
      font-weight: 600;
      display: none;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="short">
      <video id="video"></video>
      <div id="player-bg"></div>
      <div id="list"></div>
      <div id="overlay" class="hidden">
        <div id="channel">
          <div id="avatar">C</div>
          <span id="channel-name">@cobalt_demo</span>
          <span id="subscribe">Subscribe</span>
        </div>
        <div id="title">Loading...</div>
      </div>
    </div>
    <div id="actions">
      <div class="action"><div class="icon">&#128077;</div><span>1.2K</span></div>
      <div class="action"><div class="icon">&#128078;</div><span>Dislike</span></div>
      <div class="action"><div class="icon">&#128172;</div><span>48</span></div>
      <div class="action"><div class="icon">&#10150;</div><span>Share</span></div>
    </div>
    <div id="nav">
      <div class="nav-btn">&#9650;</div>
      <div class="nav-btn active" id="nav-down">&#9660;</div>
    </div>
    <div id="stats">Stats: waiting...</div>
    <div id="toast"></div>
  </div>
  <script src="shorts-transition-demo.js"></script>
</body>
</html>
