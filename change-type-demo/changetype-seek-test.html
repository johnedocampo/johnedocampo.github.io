<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ChangeTypeSeek (VP9 Profile 0 &lt;-&gt; 2)</title>
  <style>
    body {
      font-family: sans-serif;
      background: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 24px;
    }
    h1 { margin: 0 0 4px; font-size: 1.6rem; color: #00e5ff; }
    #subtitle { margin: 0 0 16px; color: #9e9e9e; }
    #layout { display: flex; gap: 24px; align-items: flex-start; }
    video { width: 640px; height: 360px; background: #000; }
    #results { min-width: 420px; }
    .test {
      padding: 10px 14px;
      margin-bottom: 8px;
      border-radius: 6px;
      background: #1e1e1e;
      font-family: monospace;
    }
    .test .status { font-weight: bold; }
    .pending .status { color: #9e9e9e; }
    .running .status { color: #ffd54f; }
    .pass .status { color: #66bb6a; }
    .fail .status { color: #ef5350; }
    .test .detail { color: #9e9e9e; margin-top: 4px; white-space: pre-wrap; }
    #log {
      margin-top: 16px;
      height: 260px;
      overflow-y: auto;
      background: #000;
      padding: 8px;
      font: 12px monospace;
      color: #bdbdbd;
    }
  </style>
</head>
<body>
  <h1>ChangeTypeSeek: VP9 Profile 0 &lt;-&gt; 2</h1>
  <p id="subtitle">
    Simulates a Shorts transition:
    changeType() + seek into content of a different VP9 profile.
  </p>
  <div id="layout">
    <video id="video" muted></video>
    <div id="results"></div>
  </div>
  <div id="log"></div>
  <script src="changetype-seek-test.js"></script>
</body>
</html>
